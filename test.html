<!DOCTYPE html>
<html>

<body>

    <h2>My Simple AI</h2>

    <input id="q" placeholder="Ask something">
    <button onclick="chat()">Ask</button>

    <p id="a"></p>

    <script>

        function chat() {

            let q = document.getElementById("q").value.toLowerCase()
            let reply = "I don't understand."

            if (q.includes("hello")) reply = "Hello! How can I help?"
            if (q.includes("price")) reply = "Price depends on the product."
            if (q.includes("gst")) reply = "GST has CGST and SGST."

            document.getElementById("a").innerText = reply

        }

    </script>

</body>

</html>
